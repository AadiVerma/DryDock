id: ecs-021-task-role-permission
title: Access denied
difficulty: 3
estimated_minutes: 25
topic: IAM
cluster: shop-prod
brief: |
  The team pushed a new image. Deploy checkout-api:8 to production.

  checkout-api runs in the shop-prod cluster behind the checkout-tg target
  group. Revision 7 is live and healthy. Revision 8 is already registered.

  The new version stores receipts in the shop-receipts S3 bucket.
seed: seed.yaml
success:
- service_stable:
    service: checkout-api
- targets_healthy:
    target_group: checkout-tg
- task_def_lineage:
    service: checkout-api
    derived_from: 8
forbid:
- desired_count_below:
    service: checkout-api
    min: 2
- health_check_disabled:
    target_group: checkout-tg
- health_check_matcher_widened:
    target_group: checkout-tg
- grace_period_above:
    service: checkout-api
    max_seconds: 120
- role_policy_too_broad:
    role: checkout-task-role
partial:
- rolled_back:
    when:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
    message: |
      You rolled back, which is the right call during an incident.
      Now fix revision 8 and deploy it properly.
hints:
- after_minutes: 5
  text: 'The tasks start, log one error and exit. Read it carefully: it names who was denied, and what.'
- after_minutes: 10
  text: The identity in the log is the task role. Which permissions does that role have today?
- after_minutes: 15
  text: The error names an action and a bucket. Grant that action on that bucket, and nothing more.
teaches:
- An application in a task calls AWS as the task role, not as you
- AccessDenied names the action that was refused and the identity that was refused
- The fix belongs in IAM, on the task role; nothing in the task definition is wrong
- Grant the specific action on the specific resource; a wildcard policy is a shortcut, not a fix
on_aws:
- On AWS the identity in the error is an assumed-role ARN ending in the task ID, and the denied call is recorded
  in CloudTrail.
- 'A crash-looping service is slowed down on AWS: ECS waits longer between launches after repeated failures. The
  lab relaunches every few seconds.'
selftest:
  trap: &id001
  - update_service:
      service: checkout-api
      task_definition: checkout-api:8
  broken:
  - stopped_task_with:
      service: checkout-api
      stopped_reason_contains: Essential container
      exit_code: 1
  - log_contains:
      log_group: /ecs/checkout-api
      text: AccessDenied
  - not:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
  shortcuts:
  - name: roll back to revision 7
    expect: partial
    steps:
    - update_service:
        service: checkout-api
        task_definition: checkout-api:7
    undo: *id001
  - name: scale to zero
    steps:
    - update_service:
        service: checkout-api
        desired_count: 0
    undo:
    - update_service:
        service: checkout-api
        desired_count: 2
  - name: grant the role everything
    steps:
    - put_role_policy:
        role: checkout-task-role
        name: everything
        statements:
        - Effect: Allow
          Action: '*'
          Resource: '*'
    undo:
    - delete_role_policy:
        role: checkout-task-role
        name: everything
  solution:
  - put_role_policy:
      role: checkout-task-role
      name: receipts
      statements:
      - Effect: Allow
        Action:
        - s3:ListBucket
        Resource: arn:aws:s3:::shop-receipts
  - update_service:
      service: checkout-api
      task_definition: checkout-api:latest
replay:
  first_move: DescribeServices
  notes:
    DescribeServices: the right first move
  key_call:
    action: DescribeTasks
    detail: stopped
    note: the failure was visible here
  missed_key_call: |
    You fixed it without reading a stopped task. stoppedReason, the stop code and the
    exit code name the failure in one line; check them first next time.
  answer_call:
    action: GetLogEvents
    alternatives:
    - FilterLogEvents
    - StartLiveTail
    note: the answer was here
  efficient_within_seconds: 180
  time_sinks:
  - action: DescribeTargetHealth
    min_seconds: 120
    message: |
      You spent {minutes} on target health before reading a stopped task.
      Missing targets are a symptom here: no task stayed up long enough to register.
  - action: UpdateService
    min_count: 4
    message: |
      You redeployed {count} times. Redeploying the same configuration
      repeats the same failure; change something first.
