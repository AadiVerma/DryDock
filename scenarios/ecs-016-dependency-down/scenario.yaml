id: ecs-016-dependency-down
title: Somebody else's outage
difficulty: 3
estimated_minutes: 25
topic: Dependencies
cluster: shop-prod
brief: |
  checkout-api started crash-looping after a routine restart ten minutes ago.
  Nobody has changed checkout. Find out why and get it serving again.

  checkout-api runs in the shop-prod cluster behind the checkout-tg target group.
  It calls the inventory service, which another team runs in the same cluster.
seed: seed.yaml
success:
- service_stable:
    service: checkout-api
- targets_healthy: &id001
    target_group: checkout-tg
- service_running:
    service: inventory
    min: 1
- service_env:
    service: checkout-api
    name: INVENTORY_URL
    value: http://inventory.shop.internal:8080/health
forbid:
- desired_count_below:
    service: checkout-api
    min: 2
- health_check_disabled: *id001
- health_check_matcher_widened: *id001
hints:
- after_minutes: 5
  text: Checkout's logs name the thing it cannot reach. That thing is not checkout.
- after_minutes: 10
  text: Look at the other services in the cluster. Is the one checkout depends on actually running?
- after_minutes: 15
  text: A service with zero desired tasks is not failing, it has been switched off. Who can switch it back on?
teaches:
- The service that is crashing is not always the service that is broken
- A dependency that is down removes its DNS name, so callers see a name resolution failure
- Read the whole cluster, not just the service in the alert
- Fix the dependency; do not remove the dependency check to make the symptom go away
on_aws:
- Cloud Map DNS answers are cached for their TTL on AWS, so a recovered or renamed dependency can take up to a minute
  to resolve.
- On AWS the other team's service would show its own events and alarms; in an incident, ask before you scale someone
  else's service.
selftest:
  broken:
  - stopped_task_with:
      service: checkout-api
      stopped_reason_contains: Essential container
      exit_code: 1
  - log_contains:
      log_group: /ecs/checkout-api
      text: cannot reach dependency
  shortcuts:
  - name: remove the dependency from checkout
    expect: failing
    timeout: 60
    steps:
    - register_revision:
        base: checkout-api:7
        unset_env:
        - INVENTORY_URL
    - update_service:
        service: checkout-api
        task_definition: checkout-api:latest
    undo:
    - update_service:
        service: checkout-api
        task_definition: checkout-api:7
  solution:
  - update_service:
      service: inventory
      desired_count: 1
replay:
  first_move: DescribeServices
  notes:
    DescribeServices: the right first move
  key_call:
    action: DescribeTasks
    detail: stopped
    note: the failure was visible here
  missed_key_call: |
    You fixed it without reading a stopped task. stoppedReason, the stop code and the
    exit code name the failure in one line; check them first next time.
  answer_call:
    action: GetLogEvents
    alternatives:
    - FilterLogEvents
    - StartLiveTail
    note: the answer was here
  efficient_within_seconds: 180
  time_sinks:
  - action: DescribeTargetHealth
    min_seconds: 120
    message: |
      You spent {minutes} on target health before reading a stopped task.
      Missing targets are a symptom here: no task stayed up long enough to register.
  - action: UpdateService
    min_count: 4
    message: |
      You redeployed {count} times. Redeploying the same configuration
      repeats the same failure; change something first.
