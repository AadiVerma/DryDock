id: ecs-028-three-faults
title: The long afternoon
difficulty: 5
estimated_minutes: 45
topic: More than one thing wrong
cluster: shop-prod
brief: |
  The team pushed a new image. Deploy checkout-api:8 to production.

  checkout-api runs in the shop-prod cluster behind the checkout-tg target
  group. Revision 7 is live and healthy. Revision 8 is already registered.
seed: seed.yaml
success:
- service_stable:
    service: checkout-api
- targets_healthy:
    target_group: checkout-tg
- task_def_lineage:
    service: checkout-api
    derived_from: 8
    image: ecslab/checkout-api:1.5.0
forbid:
- desired_count_below:
    service: checkout-api
    min: 2
- health_check_disabled:
    target_group: checkout-tg
- health_check_matcher_widened:
    target_group: checkout-tg
- grace_period_above:
    service: checkout-api
    max_seconds: 120
partial:
- rolled_back:
    when:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
    message: |
      You rolled back, which is the right call during an incident.
      Now fix revision 8 and deploy it properly.
hints:
- after_minutes: 5
  text: Start with the newest stopped task and fix exactly what it names.
- after_minutes: 10
  text: When the tasks finally stay up, do not stop. Running is not the same as serving.
- after_minutes: 15
  text: 'Three things are wrong and they fail in order: before the pull, before the app starts, and after it is
    running.'
teaches:
- A bad deployment can fail in stages, each fix revealing the next fault
- 'The last fault may be silent: tasks running, deployment complete, and no traffic getting through'
- Finish by checking target health, not the service's running count
- Verify the outcome customers see, not the absence of errors
on_aws:
- On AWS, ECS stops and replaces tasks whose targets fail the load balancer health check, with 'failed ELB health
  checks' in stoppedReason and the service events. The lab leaves those tasks running.
- 'A crash-looping service is slowed down on AWS: ECS waits longer between launches after repeated failures. The
  lab relaunches every few seconds.'
- With the deployment circuit breaker enabled, AWS marks the deployment FAILED and rolls back by itself. The lab
  always reports the rollout as completed, so never trust that field here.
selftest:
  trap: &id001
  - update_service:
      service: checkout-api
      task_definition: checkout-api:8
  broken:
  - stopped_task_with:
      service: checkout-api
      stop_code: TaskFailedToStart
      stopped_reason_contains: pull access denied
  - not:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
  shortcuts:
  - name: roll back to revision 7
    expect: partial
    steps:
    - update_service:
        service: checkout-api
        task_definition: checkout-api:7
    undo: *id001
  - name: scale to zero
    steps:
    - update_service:
        service: checkout-api
        desired_count: 0
    undo:
    - update_service:
        service: checkout-api
        desired_count: 2
  solution:
  - register_revision:
      base: checkout-api:8
      image: ecslab/checkout-api:1.5.0
      set_env:
        PORT: '8080'
  - register_revision:
      base: checkout-api:latest
      container: migrate
      set_env:
        MIGRATIONS_DATABASE_URL: postgres://checkout@db.shop.internal:5432/checkout
  - update_service:
      service: checkout-api
      task_definition: checkout-api:latest
replay:
  first_move: DescribeServices
  notes:
    DescribeServices: the right first move
  key_call:
    action: DescribeTasks
    detail: stopped
    note: the answer was here
  missed_key_call: |
    You fixed it without reading a stopped task. stoppedReason, the stop code and the
    exit code name the failure in one line; check them first next time.
  efficient_within_seconds: 180
  time_sinks:
  - action: DescribeTargetHealth
    min_seconds: 120
    message: |
      You spent {minutes} on target health before reading a stopped task.
      Missing targets are a symptom here: no task stayed up long enough to register.
  - action: UpdateService
    min_count: 4
    message: |
      You redeployed {count} times. Redeploying the same configuration
      repeats the same failure; change something first.
