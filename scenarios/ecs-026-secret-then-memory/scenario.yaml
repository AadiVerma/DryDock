id: ecs-026-secret-then-memory
title: Two for the price of one
difficulty: 4
estimated_minutes: 35
topic: More than one thing wrong
cluster: shop-prod
brief: |
  The team pushed a new image. Deploy checkout-api:8 to production.

  checkout-api runs in the shop-prod cluster behind the checkout-tg target
  group. Revision 7 is live and healthy. Revision 8 is already registered.

  The new version reads its database password from Secrets Manager.
seed: seed.yaml
success:
- service_stable:
    service: checkout-api
- targets_healthy:
    target_group: checkout-tg
- task_def_lineage:
    service: checkout-api
    derived_from: 8
forbid:
- desired_count_below:
    service: checkout-api
    min: 2
- health_check_disabled:
    target_group: checkout-tg
- health_check_matcher_widened:
    target_group: checkout-tg
- grace_period_above:
    service: checkout-api
    max_seconds: 120
partial:
- rolled_back:
    when:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
    message: |
      You rolled back, which is the right call during an incident.
      Now fix revision 8 and deploy it properly.
hints:
- after_minutes: 5
  text: Fix what the newest stopped task tells you, then look again.
- after_minutes: 10
  text: After the first fix the tasks get further and fail differently. The stop code and exit code have changed.
- after_minutes: 15
  text: The second failure leaves no error message. What kills a container without a word?
teaches:
- Fixing one fault can expose another that was hidden behind it
- A task that fails before its container starts cannot reveal problems inside the container
- 'Re-read the newest stopped task after every change: a different stop code is progress'
- Exit code 137 with no error in the logs points at the memory limit
on_aws:
- On AWS the execution role must also be allowed to read the secret or parameter; without it you get the same ResourceInitializationError
  with AccessDenied in the text. The lab does not check the execution role.
- 'On AWS the second failure names itself: ''OutOfMemoryError: Container killed due to memory usage''.'
selftest:
  trap: &id001
  - update_service:
      service: checkout-api
      task_definition: checkout-api:8
  broken:
  - stopped_task_with:
      service: checkout-api
      stop_code: TaskFailedToStart
      stopped_reason_contains: ResourceInitializationError
  - not:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
  shortcuts:
  - name: roll back to revision 7
    expect: partial
    steps:
    - update_service:
        service: checkout-api
        task_definition: checkout-api:7
    undo: *id001
  - name: scale to zero
    steps:
    - update_service:
        service: checkout-api
        desired_count: 0
    undo:
    - update_service:
        service: checkout-api
        desired_count: 2
  solution:
  - register_revision:
      base: checkout-api:8
      set:
        memory: 512
        secrets:
        - name: DB_PASSWORD
          valueFrom: '${secret:shop/prod/db}:password::'
  - update_service:
      service: checkout-api
      task_definition: checkout-api:latest
replay:
  first_move: DescribeServices
  notes:
    DescribeServices: the right first move
  key_call:
    action: DescribeTasks
    detail: stopped
    note: the answer was here
  missed_key_call: |
    You fixed it without reading a stopped task. stoppedReason, the stop code and the
    exit code name the failure in one line; check them first next time.
  efficient_within_seconds: 180
  time_sinks:
  - action: DescribeTargetHealth
    min_seconds: 120
    message: |
      You spent {minutes} on target health before reading a stopped task.
      Missing targets are a symptom here: no task stayed up long enough to register.
  - action: UpdateService
    min_count: 4
    message: |
      You redeployed {count} times. Redeploying the same configuration
      repeats the same failure; change something first.
