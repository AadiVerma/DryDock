# Starting state for ecs-001. The seeder is idempotent: run it twice and you get
# the same environment.
cluster: shop-prod

# Images are built locally by `ecslab start`; nothing is pulled at lab time.
images:
  - tag: ecslab/checkout-api:1.4.2
    context: images/checkout-api
    build_args: { APP_VERSION: "1.4.2" }
  - tag: ecslab/checkout-api:1.5.0
    context: images/checkout-api
    build_args: { APP_VERSION: "1.5.0" }

task_definitions:
  - family: checkout-api
    container: app
    container_port: 8080
    log_group: /ecs/checkout-api
    # Earlier revisions are registered as history so the numbering is realistic.
    first_revision: 7
    revisions:
      # 7: live and healthy.
      - image: ecslab/checkout-api:1.4.2
        environment:
          PORT: "8080"
          DATABASE_URL: postgres://checkout@db.shop.internal:5432/checkout
      # 8: the new image. From 1.5.0 the service needs PAYMENTS_API_URL, and
      # nobody added it to the task definition. Nothing is injected at runtime.
      - image: ecslab/checkout-api:1.5.0
        environment:
          PORT: "8080"
          DATABASE_URL: postgres://checkout@db.shop.internal:5432/checkout

target_group:
  name: checkout-tg
  port: 8080
  health_check:
    path: /health
    port: traffic-port
    interval_seconds: 5
    timeout_seconds: 2
    healthy_threshold: 2
    unhealthy_threshold: 2
    matcher: "200"

load_balancer:
  name: checkout-alb
  listener_port: 8081

service:
  name: checkout-api
  task_definition: checkout-api:7
  desired_count: 2
  container: app
  container_port: 8080
  health_check_grace_period_seconds: 0
