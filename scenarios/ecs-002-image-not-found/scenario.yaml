id: ecs-002-image-not-found
title: The image that isn't there
difficulty: 1
estimated_minutes: 15
topic: Tasks that never start
cluster: shop-prod
brief: |
  The team pushed a new image. Deploy checkout-api:8 to production.

  checkout-api runs in the shop-prod cluster behind the checkout-tg target
  group. Revision 7 is live and healthy. Revision 8 is already registered.
seed: seed.yaml
success:
- service_stable:
    service: checkout-api
- targets_healthy:
    target_group: checkout-tg
- task_def_lineage:
    service: checkout-api
    derived_from: 8
    image: ecslab/checkout-api:1.5.0
forbid:
- desired_count_below:
    service: checkout-api
    min: 2
- health_check_disabled:
    target_group: checkout-tg
- health_check_matcher_widened:
    target_group: checkout-tg
- grace_period_above:
    service: checkout-api
    max_seconds: 120
partial:
- rolled_back:
    when:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
    message: |
      You rolled back, which is the right call during an incident.
      Now fix revision 8 and deploy it properly.
hints:
- after_minutes: 5
  text: Is anything from revision 8 actually running?
- after_minutes: 10
  text: A task that never started still leaves a stopped task behind. Read its stoppedReason in full.
- after_minutes: 15
  text: Compare the image in revision 8 with the image in revision 7, character by character.
teaches:
- A task that cannot start stops with TaskFailedToStart, and stoppedReason carries the container runtime's error
- '''pull access denied'' or ''not found'' means the image name or tag is wrong, or the registry is unreachable'
- A task that fails before its container starts writes no application logs, so the logs are the wrong place to look
- 'A task definition is immutable: fixing it means registering a new revision'
on_aws:
- On AWS the stoppedReason begins with CannotPullContainerError and quotes the registry's answer.
- 'A crash-looping service is slowed down on AWS: ECS waits longer between launches after repeated failures. The
  lab relaunches every few seconds.'
- With the deployment circuit breaker enabled, AWS marks the deployment FAILED and rolls back by itself. The lab
  always reports the rollout as completed, so never trust that field here.
selftest:
  trap: &id001
  - update_service:
      service: checkout-api
      task_definition: checkout-api:8
  broken:
  - stopped_task_with:
      service: checkout-api
      stop_code: TaskFailedToStart
      stopped_reason_contains: pull access denied
  - not:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
  shortcuts:
  - name: roll back to revision 7
    expect: partial
    steps:
    - update_service:
        service: checkout-api
        task_definition: checkout-api:7
    undo: *id001
  - name: scale to zero
    steps:
    - update_service:
        service: checkout-api
        desired_count: 0
    undo:
    - update_service:
        service: checkout-api
        desired_count: 2
  solution:
  - register_revision:
      base: checkout-api:8
      image: ecslab/checkout-api:1.5.0
  - update_service:
      service: checkout-api
      task_definition: checkout-api:latest
replay:
  first_move: DescribeServices
  notes:
    DescribeServices: the right first move
  key_call:
    action: DescribeTasks
    detail: stopped
    note: the answer was here
  missed_key_call: |
    You fixed it without reading a stopped task. stoppedReason, the stop code and the
    exit code name the failure in one line; check them first next time.
  efficient_within_seconds: 180
  time_sinks:
  - action: DescribeTargetHealth
    min_seconds: 120
    message: |
      You spent {minutes} on target health before reading a stopped task.
      Missing targets are a symptom here: no task stayed up long enough to register.
  - action: UpdateService
    min_count: 4
    message: |
      You redeployed {count} times. Redeploying the same configuration
      repeats the same failure; change something first.
