id: ecs-005-out-of-memory
title: Killed without a word
difficulty: 3
estimated_minutes: 25
topic: Tasks that start and then die
cluster: shop-prod
brief: |
  The team pushed a new image. Deploy checkout-api:8 to production.

  checkout-api runs in the shop-prod cluster behind the checkout-tg target
  group. Revision 7 is live and healthy. Revision 8 is already registered.
seed: seed.yaml
success:
- service_stable:
    service: checkout-api
- targets_healthy:
    target_group: checkout-tg
- task_def_lineage:
    service: checkout-api
    derived_from: 8
forbid:
- desired_count_below:
    service: checkout-api
    min: 2
- health_check_disabled:
    target_group: checkout-tg
- health_check_matcher_widened:
    target_group: checkout-tg
- grace_period_above:
    service: checkout-api
    max_seconds: 120
partial:
- rolled_back:
    when:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
    message: |
      You rolled back, which is the right call during an incident.
      Now fix revision 8 and deploy it properly.
hints:
- after_minutes: 5
  text: What exit code do the stopped tasks have? It is not an ordinary error code.
- after_minutes: 10
  text: 'Exit code 137 is 128 + 9: the container was killed, it did not exit by itself. What gets a container killed?'
- after_minutes: 15
  text: Read the last log line before the kill, then compare it with the container's memory limit in revision 8.
teaches:
- Exit code 137 means the container was killed with SIGKILL; with no error in the logs, suspect the memory limit
- 'The logs of a killed container simply stop: the last line shows what it was doing when it died'
- A container-level memory value is a hard limit; exceed it and the container is killed
- Size the limit from what the application needs at startup, not from what the old version needed
on_aws:
- 'On AWS the container''s reason reads ''OutOfMemoryError: Container killed due to memory usage'', so you are told
  directly. The lab gives you only exit code 137.'
- 'A crash-looping service is slowed down on AWS: ECS waits longer between launches after repeated failures. The
  lab relaunches every few seconds.'
selftest:
  trap: &id001
  - update_service:
      service: checkout-api
      task_definition: checkout-api:8
  broken:
  - stopped_task_with:
      service: checkout-api
      stopped_reason_contains: Essential container
      exit_code: 137
  - log_contains:
      log_group: /ecs/checkout-api
      text: loading 300 MB into memory
  - not:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
  shortcuts:
  - name: roll back to revision 7
    expect: partial
    steps:
    - update_service:
        service: checkout-api
        task_definition: checkout-api:7
    undo: *id001
  - name: scale to zero
    steps:
    - update_service:
        service: checkout-api
        desired_count: 0
    undo:
    - update_service:
        service: checkout-api
        desired_count: 2
  solution:
  - register_revision:
      base: checkout-api:8
      set:
        memory: 512
  - update_service:
      service: checkout-api
      task_definition: checkout-api:latest
replay:
  first_move: DescribeServices
  notes:
    DescribeServices: the right first move
  key_call:
    action: DescribeTasks
    detail: stopped
    note: the failure was visible here
  missed_key_call: |
    You fixed it without reading a stopped task. stoppedReason, the stop code and the
    exit code name the failure in one line; check them first next time.
  answer_call:
    action: GetLogEvents
    alternatives:
    - FilterLogEvents
    - StartLiveTail
    note: the answer was here
  efficient_within_seconds: 180
  time_sinks:
  - action: DescribeTargetHealth
    min_seconds: 120
    message: |
      You spent {minutes} on target health before reading a stopped task.
      Missing targets are a symptom here: no task stayed up long enough to register.
  - action: UpdateService
    min_count: 4
    message: |
      You redeployed {count} times. Redeploying the same configuration
      repeats the same failure; change something first.
