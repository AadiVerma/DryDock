# Starting state. The seeder is idempotent.
cluster: shop-prod
emulator:
  security_groups: true
images:
- tag: ecslab/checkout-api:1.4.2
  context: images/checkout-api
  build_args:
    APP_VERSION: 1.4.2
- tag: ecslab/checkout-api:1.5.0
  context: images/checkout-api
  build_args:
    APP_VERSION: 1.5.0
task_definitions:
- family: checkout-api
  container: app
  container_port: 8080
  log_group: /ecs/checkout-api
  first_revision: 7
  revisions:
  - image: ecslab/checkout-api:1.4.2
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://checkout@db.shop.internal:5432/checkout
target_group:
  name: checkout-tg
  port: 8080
  health_check:
    path: /health
    port: traffic-port
    interval_seconds: 5
    timeout_seconds: 2
    healthy_threshold: 2
    unhealthy_threshold: 2
    matcher: '200'
load_balancer:
  name: checkout-alb
  listener_port: 8081
service:
  name: checkout-api
  task_definition: checkout-api:7
  desired_count: 2
  container: app
  container_port: 8080
  health_check_grace_period_seconds: 0
incident:
- set_security_group_ingress:
    group: checkout-sg
    rules:
    - port: 8443
      cidr: 0.0.0.0/0
security_group:
  name: checkout-sg
  description: checkout-api tasks
  ingress:
  - port: 8080
    cidr: 0.0.0.0/0
