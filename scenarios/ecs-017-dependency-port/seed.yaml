# Starting state. The seeder is idempotent.
cluster: shop-prod
images:
- tag: ecslab/checkout-api:1.4.2
  context: images/checkout-api
  build_args:
    APP_VERSION: 1.4.2
- tag: ecslab/checkout-api:1.5.0
  context: images/checkout-api
  build_args:
    APP_VERSION: 1.5.0
task_definitions:
- family: checkout-api
  container: app
  container_port: 8080
  log_group: /ecs/checkout-api
  first_revision: 7
  revisions:
  - image: ecslab/checkout-api:1.4.2
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://checkout@db.shop.internal:5432/checkout
      INVENTORY_URL: http://inventory.shop.internal:8080/health
  - image: ecslab/checkout-api:1.5.0
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://checkout@db.shop.internal:5432/checkout
      PAYMENTS_API_URL: https://payments.shop.internal
      INVENTORY_URL: http://inventory.shop.internal:9090/health
target_group:
  name: checkout-tg
  port: 8080
  health_check:
    path: /health
    port: traffic-port
    interval_seconds: 5
    timeout_seconds: 2
    healthy_threshold: 2
    unhealthy_threshold: 2
    matcher: '200'
load_balancer:
  name: checkout-alb
  listener_port: 8081
service:
  name: checkout-api
  task_definition: checkout-api:7
  desired_count: 2
  container: app
  container_port: 8080
  health_check_grace_period_seconds: 0
extra_services:
- name: inventory
  image: ecslab/checkout-api:1.4.2
  environment:
    PORT: '8080'
  desired_count: 1
  discovery:
    namespace: shop.internal
    name: inventory
