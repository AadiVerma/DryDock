id: ecs-006-migration-fails
title: Waiting on a migration
difficulty: 3
estimated_minutes: 25
topic: Tasks that never start
cluster: shop-prod
brief: |
  The team pushed a new image. Deploy checkout-api:8 to production.

  checkout-api runs in the shop-prod cluster behind the checkout-tg target
  group. Revision 7 is live and healthy. Revision 8 is already registered.
seed: seed.yaml
success:
- service_stable:
    service: checkout-api
- targets_healthy:
    target_group: checkout-tg
- task_def_lineage:
    service: checkout-api
    derived_from: 8
forbid:
- desired_count_below:
    service: checkout-api
    min: 2
- health_check_disabled:
    target_group: checkout-tg
- health_check_matcher_widened:
    target_group: checkout-tg
- grace_period_above:
    service: checkout-api
    max_seconds: 120
partial:
- rolled_back:
    when:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
    message: |
      You rolled back, which is the right call during an incident.
      Now fix revision 8 and deploy it properly.
hints:
- after_minutes: 5
  text: Revision 8 has more than one container. Which of them is failing?
- after_minutes: 10
  text: stoppedReason says which container the app was waiting for and what happened to it.
- after_minutes: 15
  text: Each container has its own log stream. Read the one for the container that exited.
teaches:
- dependsOn with condition SUCCESS means the app container only starts if the other container exits with code 0
- When a dependency fails, the app container never runs, so it has no logs; the dependency's logs hold the cause
- 'Each container in a task logs to its own stream: prefix/container-name/task-id'
- Environment variables are set per container; the migration container does not inherit the app's
on_aws:
- The service's Events tab on AWS names the failure (for example 'tasks failed to start'). In the lab, events only
  ever say the service reached a steady state.
- 'A crash-looping service is slowed down on AWS: ECS waits longer between launches after repeated failures. The
  lab relaunches every few seconds.'
- With the deployment circuit breaker enabled, AWS marks the deployment FAILED and rolls back by itself. The lab
  always reports the rollout as completed, so never trust that field here.
selftest:
  trap: &id001
  - update_service:
      service: checkout-api
      task_definition: checkout-api:8
  broken:
  - stopped_task_with:
      service: checkout-api
      stop_code: TaskFailedToStart
      stopped_reason_contains: dependency container exited
  - log_contains:
      log_group: /ecs/checkout-api
      text: MIGRATIONS_DATABASE_URL is not set
  - not:
      task_def_lineage_is:
        service: checkout-api
        revision: 7
  shortcuts:
  - name: roll back to revision 7
    expect: partial
    steps:
    - update_service:
        service: checkout-api
        task_definition: checkout-api:7
    undo: *id001
  - name: scale to zero
    steps:
    - update_service:
        service: checkout-api
        desired_count: 0
    undo:
    - update_service:
        service: checkout-api
        desired_count: 2
  solution:
  - register_revision:
      base: checkout-api:8
      container: migrate
      set_env:
        MIGRATIONS_DATABASE_URL: postgres://checkout@db.shop.internal:5432/checkout
  - update_service:
      service: checkout-api
      task_definition: checkout-api:latest
replay:
  first_move: DescribeServices
  notes:
    DescribeServices: the right first move
  key_call:
    action: DescribeTasks
    detail: stopped
    note: the failure was visible here
  missed_key_call: |
    You fixed it without reading a stopped task. stoppedReason, the stop code and the
    exit code name the failure in one line; check them first next time.
  answer_call:
    action: GetLogEvents
    alternatives:
    - FilterLogEvents
    - StartLiveTail
    note: the answer was here
  efficient_within_seconds: 180
  time_sinks:
  - action: DescribeTargetHealth
    min_seconds: 120
    message: |
      You spent {minutes} on target health before reading a stopped task.
      Missing targets are a symptom here: no task stayed up long enough to register.
  - action: UpdateService
    min_count: 4
    message: |
      You redeployed {count} times. Redeploying the same configuration
      repeats the same failure; change something first.
